<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ws://127.0.0.1:*; script-src 'self'; style-src 'self'"><link rel="stylesheet" href="style.css"><title>VTube Control</title></head><body>
<label>Target<select id="target"><option value="peer">Canada / other PC</option><option value="local">Pantry / this PC</option></select></label>
<label>Action<select id="action"><option value="obs.scene">OBS — change scene</option><option value="spotify.play">Spotify — play</option><option value="spotify.pause">Spotify — pause</option><option value="spotify.next">Spotify — next track</option><option value="spotify.previous">Spotify — previous track</option><option value="vts.trigger">VTube Studio — hotkey / Item Scene</option><option value="reactive.show">Reactives — show on Canada</option><option value="reactive.hide">Reactives — hide on Canada</option><option value="reactive.start">Reactives — start renderer on Pantry</option><option value="reactive.stop">Reactives — stop renderer on Pantry</option></select></label>
<label>Scene name / hotkey ID<input id="value" list="choices"><datalist id="choices"></datalist></label><button id="discover">Fetch scenes / hotkeys</button><p id="message" aria-live="polite">Enable and pair VTube Control on both PCs first. Renderer start/stop target Pantry; show/hide target Canada.</p><script src="app.js"></script></body></html>
