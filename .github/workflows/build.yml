name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile, test, and package both PCs
        shell: powershell
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VTubeInputBridge-Windows
          path: build/*.zip
  controls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Installer dry-run checks
        shell: pwsh
        run: ./scripts/control-tests/Installer.Tests.ps1
      - name: Build optional control companion and plugin
        shell: pwsh
        run: ./scripts/build-controls.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VTubeControl-Preview
          path: |
            build/VTubeControl-*.zip
            build/*.streamDeckPlugin
