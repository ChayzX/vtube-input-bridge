name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      artifacts_only:
        description: Build installers without running test suites
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  rust:
    if: github.event_name != 'workflow_dispatch' || !inputs.artifacts_only
    runs-on: [self-hosted, homelab-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
  windows:
    # Manual only. Runs on the Canada Windows runner (started on demand, low priority). It builds the sender app and
    # runs the C# suites with the .NET Framework compiler already on that PC, so -SkipReceiver leaves the Rust
    # receiver to the Linux job and nothing needs installing on Canada.
    if: github.event_name == 'workflow_dispatch' && !inputs.artifacts_only
    runs-on: [self-hosted, Windows, vtube-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Compile, test, and package the gaming PC app
        shell: powershell
        run: .\scripts\build-windows.ps1 -SkipReceiver
      - uses: actions/upload-artifact@v4
        with:
          name: VTubeInputBridge-GamingPC
          path: |
            build/*.zip
            build/SHA256SUMS.txt
  controls:
    # The companion, Stream Deck plugin, and Spotify helper all build for Windows from Linux, so this uses the same
    # self-hosted runner as the Rust job (hosted runners are unavailable for this account). PowerShell comes from the
    # .NET tool so the installer and rollback fixture suites run here too.
    runs-on: [self-hosted, homelab-ci]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows GNU cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        env:
          # The default, /usr/share/dotnet, is not writable by the runner user.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x
      - name: Install PowerShell
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/pwsh" PowerShell
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
      - name: Build optional control companion and plugin
        shell: bash
        run: pwsh -NoProfile -File ./scripts/build-controls.ps1 ${{ inputs.artifacts_only && '-SkipTests' || '' }}
      - name: Attach installers to a draft preview release
        if: inputs.artifacts_only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./control_app/package.json').version")
          tag="v$version"
          # A stable version (no "-preview"/"-rc" suffix) built from main is published as the latest release, which is
          # what the app's "Check for updates" looks for. Anything else stays a draft pre-release.
          if [[ "$version" != *-* && "$GITHUB_REF" == refs/heads/main ]]; then
            kind=(--latest); notes="Installer for both PCs (it asks whether it is on the Gaming PC or the Streaming PC). Update both PCs."
          else
            kind=(--draft --prerelease); notes='Draft installer for both PCs (it asks whether it is on the Gaming PC or the Streaming PC). Not published.'
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${kind[@]}" --target "$GITHUB_SHA" \
              --title "VTube Input Bridge $version" --notes "$notes"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            build/Install-VTubeInputBridge.cmd
      # Installers ship through the draft release above. This copy is a convenience: the bundle is several hundred MB,
      # so a full artifact storage quota must not fail the build, and it expires after a day.
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.artifacts_only }}
        continue-on-error: true
        with:
          name: VTubeControl-Preview
          retention-days: 1
          path: |
            build/VTubeControl-*.zip
            build/*.streamDeckPlugin
            build/Install-VTubeInputBridge.cmd
