name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: [self-hosted, homelab-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
  windows:
    # Manual only. Runs on the Canada Windows runner (started on demand, low priority). It builds the sender app and
    # runs the C# suites with the .NET Framework compiler already on that PC, so -SkipReceiver leaves the Rust
    # receiver to the Linux job and nothing needs installing on Canada.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, vtube-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Compile, test, and package the gaming PC app
        shell: powershell
        run: .\scripts\build-windows.ps1 -SkipReceiver
      - uses: actions/upload-artifact@v4
        with:
          name: VTubeInputBridge-GamingPC
          path: |
            build/*.zip
            build/SHA256SUMS.txt
